[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "consulting-template-kit"
version = "0.1.0"
description = "Public-safe consulting and technical-writing templates with a lightweight release gate."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Zain Dana Harper" }]
keywords = ["consulting", "templates", "technical-writing", "freelance", "sow"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Documentation",
  "Topic :: Office/Business",
]

[project.scripts]
ctk-validate = "consulting_template_kit.validator:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
